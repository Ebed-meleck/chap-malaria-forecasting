name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"

jobs:
  quality:
    name: Lint, test, and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv and Python from the project declaration
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.12.17"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Verify lockfile and install all quality dependencies
        run: uv sync --frozen --all-groups

      - name: Lint and formatting gate
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Static typing gate
        run: uv run mypy src

      - name: Unit, temporal, integration, contract, and performance tests
        run: uv run pytest --junitxml=junit.xml --cov=chap_malaria_forecasting --cov-report=term-missing --cov-report=xml

      - name: Audit the locked Python dependency graph
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file requirements-audit.txt
          uv run pip-audit --require-hashes --disable-pip -r requirements-audit.txt

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-evidence-${{ github.sha }}
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 14

  container:
    name: Build Linux AMD64, smoke test, then publish
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Prepare immutable image metadata
        id: metadata
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ghcr.io/${{ github.repository }}
          # sha-<7 chars> is the immutable tag the CHAP marketplace pins and
          # chap-admin pulls; the long form is kept for exact traceability.
          tags: |
            type=sha,prefix=sha-
            type=sha,format=long,prefix=sha-
            type=ref,event=tag
          # GitHub's license detection reports "AGPL-3.0"; keep the exact SPDX id.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build the candidate image for Linux AMD64
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: chap-malaria-forecasting:ci
          build-args: |
            GIT_REVISION=${{ github.sha }}
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image metadata and non-root startup
        shell: bash
        run: |
          set -euo pipefail
          image_user="$(docker image inspect chap-malaria-forecasting:ci --format '{{.Config.User}}')"
          test "${image_user}" = "chapkit:chapkit"
          # A new named volume is populated from the image's /work/data, which
          # keeps its chapkit ownership, exactly as Compose and chap-admin mount
          # it. A tmpfs would be root-owned and unwritable for the service user.
          docker volume create chap-malaria-smoke-data >/dev/null
          # No --rm: a container that exits early must stay inspectable.
          smoke_id="$(docker run --detach \
            --name chap-malaria-smoke \
            --platform linux/amd64 \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777 \
            --mount type=volume,src=chap-malaria-smoke-data,dst=/work/data \
            --env DATABASE_URL=sqlite+aiosqlite:////work/data/chapkit.db \
            --env CHAPKIT_TEMP_DIR=/tmp/chapkit \
            chap-malaria-forecasting:ci)"
          cleanup() {
            docker logs "${smoke_id}" || true
            docker rm --force "${smoke_id}" >/dev/null 2>&1 || true
            docker volume rm chap-malaria-smoke-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          healthy=false
          for attempt in $(seq 1 30); do
            if docker exec "${smoke_id}" python /usr/local/lib/chap-malaria-healthcheck.py; then
              healthy=true
              break
            fi
            if ! docker inspect "${smoke_id}" --format '{{.State.Running}}' | grep -qx true; then
              echo "container exited with code $(docker inspect "${smoke_id}" --format '{{.State.ExitCode}}')" >&2
              exit 1
            fi
            sleep 2
          done
          "${healthy}"
          # Train and predict with both engines inside the image: a healthy
          # /health does not prove that native libraries (libgomp) load.
          result="$(docker exec "${smoke_id}" chap-malaria-benchmark \
            --zones 10 --engine auto --through-service --n-estimators 10)"
          echo "${result}"
          # Application logs share stdout; the benchmark result is the last line.
          echo "${result}" | tail -n 1 | python3 -c 'import json, sys; r = json.load(sys.stdin); assert r["predictions"] == 30 and not any(k.endswith("_training") for k in r["training_errors"]), r'

      - name: Log in to GHCR only after smoke success
        if: github.event_name != 'pull_request'
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested revision with SBOM and provenance
        id: publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            GIT_REVISION=${{ github.sha }}
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

      - name: Record the production digest
        if: github.event_name != 'pull_request'
        run: |
          printf 'Published digest: `%s`\n' '${{ steps.publish.outputs.digest }}' >> "${GITHUB_STEP_SUMMARY}"
          printf 'Production Compose must use `ghcr.io/%s@%s`.\n' '${{ github.repository }}' '${{ steps.publish.outputs.digest }}' >> "${GITHUB_STEP_SUMMARY}"
          printf 'Marketplace pin: `uv run python deploy/pin_release.py --commit %s`\n' '${{ github.sha }}' >> "${GITHUB_STEP_SUMMARY}"
