[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chap-malaria-forecasting"
version = "0.2.1"
description = "Causal weekly malaria forecasting service for CHAP using XGBoost, LightGBM and controlled ensembles"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "HISP DRC engineering team" }]
requires-python = ">=3.13"
dependencies = [
    "chapkit>=2.4.1,<3",
    "joblib>=1.5,<2",
    "lightgbm>=4.6,<5",
    "numpy>=2.3,<3",
    "pandas>=2.3.3,<4",
    "psutil>=7,<8",
    "scikit-learn>=1.7,<2",
    "structlog>=25,<26",
    "xgboost>=3.1,<4",
]

[project.scripts]
chap-malaria-benchmark = "chap_malaria_forecasting.evaluation.benchmark:main"

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pandas-stubs>=2.3,<3",
    "pip-audit>=2.9,<3",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chap_malaria_forecasting"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "contract: CHAPKit service contract tests",
    "integration: integration tests using real model engines",
    "performance: resource-measuring benchmarks",
    "slow: opt-in tests unsuitable for the default local suite",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
packages = ["chap_malaria_forecasting"]

